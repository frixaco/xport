name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches CLI version
        run: |
          version=$(node -p "require('./cli/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match cli/package.json version $version"
            exit 1
          fi
      - run: pnpm check
      # npm trusted publishing (OIDC) needs npm >= 11.5.1; provenance is added automatically.
      - run: npm publish
        working-directory: cli
